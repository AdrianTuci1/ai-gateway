[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway"
version = "0.1.0"
description = "Identity and policy gateway for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "httpx>=0.27",
  "argon2-cffi>=23",
  "PyJWT>=2.9",
  "cryptography>=43",
  "alembic>=1.13",
  "mangum>=0.17",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "asgi-lifespan>=2.1",
  "moto[dynamodb]>=5.0",
]

[project.scripts]
agw = "agw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agw = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
